version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gradguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gradguide
      POSTGRES_USER: gradguide
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gradguide_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradguide -d gradguide"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gradguide-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gradguide-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gradguide-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4173:4173"

  caddy:
    image: caddy:2-alpine
    container_name: gradguide-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  gradguide_pgdata:
  caddy_data:
  caddy_config:
