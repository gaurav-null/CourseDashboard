version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gradguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradguide
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: gradguide
    ports:
      - "5432:5432"
    volumes:
      - gradguide_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gradguide-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  gradguide_pgdata:
